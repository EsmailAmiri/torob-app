<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#d72c2c" />
    <meta
      name="description"
      content="ترب همراه، نمونه دستیار خرید حضوری تهران؛ مقایسه محصول، فروشگاه‌های نزدیک و برنامه‌ریزی مراجعه با دیتاست چالش ترب."
    />
    <script>
      try {
        const t = localStorage.getItem("torob:theme:v1");
        const d =
          t === "dark" ||
          ((!t || t === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch {}
    </script>
    <title>ترب همراه | خرید خوب، همین نزدیکی</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
